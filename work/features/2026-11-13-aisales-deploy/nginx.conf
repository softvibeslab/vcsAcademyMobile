server {
    listen 80;
    listen [::]:80;
    server_name aisales.softvibes.pro;
    location /.well-known/acme-challenge/ { root /var/www/softvibes-recovery-acme; }
    location / { return 301 https://aisales.softvibes.pro$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aisales.softvibes.pro;
    ssl_certificate /etc/letsencrypt/live/aisales.softvibes.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisales.softvibes.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /srv/aisales/current/web;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:18819;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_flags vcsa_session secure httponly samesite=lax;
        proxy_read_timeout 60s;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
    location ~ /\. { deny all; }
}
