<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Post-Tour Debrief | VCSA Pocket</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&amp;family=Manrope:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#3a4559",
                        "surface-container-low": "#1b1b20",
                        "on-error": "#690005",
                        "primary-fixed": "#ffe088",
                        "surface-tint": "#e9c349",
                        "on-primary-container": "#554300",
                        "secondary": "#b6c4ff",
                        "surface-container": "#201f24",
                        "primary": "#f2ca50",
                        "tertiary-fixed-dim": "#bcc7de",
                        "on-secondary-container": "#9db2ff",
                        "on-tertiary": "#263143",
                        "on-primary": "#3c2f00",
                        "inverse-primary": "#735c00",
                        "on-secondary": "#05297a",
                        "on-surface-variant": "#d0c5af",
                        "surface": "#131317",
                        "surface-bright": "#39383e",
                        "on-background": "#e5e1e8",
                        "tertiary-fixed": "#d8e3fb",
                        "secondary-container": "#264191",
                        "surface-variant": "#353439",
                        "on-secondary-fixed": "#00164e",
                        "primary-fixed-dim": "#e9c349",
                        "inverse-surface": "#e5e1e8",
                        "error-container": "#93000a",
                        "secondary-fixed": "#dce1ff",
                        "background": "#131317",
                        "on-error-container": "#ffdad6",
                        "tertiary-container": "#a8b3ca",
                        "on-tertiary-fixed-variant": "#3c475a",
                        "on-surface": "#e5e1e8",
                        "on-primary-fixed": "#241a00",
                        "primary-container": "#d4af37",
                        "outline-variant": "#4d4635",
                        "inverse-on-surface": "#303035",
                        "on-secondary-fixed-variant": "#264191",
                        "tertiary": "#c3cee6",
                        "error": "#ffb4ab",
                        "secondary-fixed-dim": "#b6c4ff",
                        "surface-dim": "#131317",
                        "surface-container-high": "#2a292e",
                        "surface-container-highest": "#353439",
                        "surface-container-lowest": "#0e0e12",
                        "on-primary-fixed-variant": "#574500",
                        "outline": "#99907c",
                        "on-tertiary-fixed": "#111c2d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Manrope", "sans-serif"],
                        "label": ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
        .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #f2ca50;
            cursor: pointer;
            border: 2px solid #131317;
            box-shadow: 0 0 10px rgba(242, 202, 80, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center selection:bg-primary-container selection:text-on-primary-container">
<!-- Header Section (Suppressed Shell as per task: Task-Focused screens hide global nav) -->
<header class="w-full max-w-2xl px-6 pt-8 pb-12 flex justify-between items-start">
<div class="space-y-1">
<h1 class="text-[1.75rem] font-bold font-headline text-on-surface tracking-tight">Post-Tour Debrief</h1>
<p class="text-on-surface-variant font-medium opacity-80">60-second reflection</p>
</div>
<button class="p-2 rounded-full hover:bg-surface-container transition-colors duration-300">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</header>
<main class="w-full max-w-2xl px-6 flex-grow space-y-12 pb-32">
<!-- Outcome Selection: Segmented Control -->
<section class="space-y-4">
<label class="text-[0.75rem] font-medium text-on-surface-variant tracking-widest uppercase">TOUR OUTCOME</label>
<div class="grid grid-cols-3 gap-3 p-1.5 bg-surface-container-low rounded-xl">
<button class="flex flex-col items-center justify-center py-4 px-2 rounded-lg bg-primary-container text-on-primary-container transition-all duration-300 hover:shadow-lg hover:shadow-primary/10">
<span class="text-xl mb-1">🎉</span>
<span class="text-[0.875rem] font-bold">Sale</span>
</button>
<button class="flex flex-col items-center justify-center py-4 px-2 rounded-lg bg-surface-container text-on-surface-variant hover:text-on-surface transition-all duration-300">
<span class="text-xl mb-1">🤝</span>
<span class="text-[0.875rem] font-bold">No Sale</span>
</button>
<button class="flex flex-col items-center justify-center py-4 px-2 rounded-lg bg-secondary-container text-secondary transition-all duration-300 hover:brightness-110">
<span class="text-xl mb-1">📅</span>
<span class="text-[0.875rem] font-bold text-center leading-tight">Follow Up</span>
</button>
</div>
</section>
<!-- Metrics Section -->
<section class="space-y-10">
<!-- Slider 1: Objections -->
<div class="space-y-6">
<div class="flex justify-between items-center">
<label class="text-[1rem] font-medium text-on-surface">Objections Handled</label>
<span class="text-[1.125rem] font-bold text-primary font-headline bg-primary/10 px-3 py-1 rounded-lg">4</span>
</div>
<input class="w-full h-1 bg-outline-variant rounded-lg appearance-none cursor-pointer accent-primary" max="10" min="0" step="1" type="range" value="4"/>
<div class="flex justify-between text-[0.75rem] text-on-surface-variant font-medium">
<span>0</span>
<span>5</span>
<span>10</span>
</div>
</div>
<!-- Slider 2: Confidence Before -->
<div class="space-y-6 p-6 bg-surface-container-low rounded-xl border border-outline-variant/15">
<div class="flex justify-between items-center">
<label class="text-[1rem] font-medium text-on-surface">Confidence Before Tour</label>
<span class="text-[1.125rem] font-bold text-on-surface font-headline">65%</span>
</div>
<div class="flex items-center gap-4">
<span class="text-xl">😟</span>
<input class="w-full h-1 bg-outline-variant rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="0" type="range" value="65"/>
<span class="text-xl">💪</span>
</div>
</div>
<!-- Slider 3: Confidence After -->
<div class="space-y-6 p-6 bg-surface-container-low rounded-xl border border-outline-variant/15">
<div class="flex justify-between items-center">
<label class="text-[1rem] font-medium text-on-surface">Confidence After Tour</label>
<span class="text-[1.125rem] font-bold text-primary font-headline">82%</span>
</div>
<div class="flex items-center gap-4">
<span class="text-xl">😟</span>
<input class="w-full h-1 bg-outline-variant rounded-lg appearance-none cursor-pointer accent-primary" max="100" min="0" type="range" value="82"/>
<span class="text-xl">💪</span>
</div>
</div>
<!-- Toggle Switch -->
<div class="flex items-center justify-between py-2">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
<span class="text-[1rem] font-medium text-on-surface">Did you use AI Coach during this tour?</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-on-surface-variant after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary peer-checked:after:bg-on-primary"></div>
</label>
</div>
</section>
<!-- Notes Section -->
<section class="space-y-4">
<label class="text-[0.75rem] font-medium text-on-surface-variant tracking-widest uppercase">REFLECTIONS</label>
<textarea class="w-full bg-surface-container-lowest border-0 border-b border-outline-variant focus:border-primary focus:ring-0 text-[1rem] text-on-surface placeholder:text-outline p-4 min-h-[120px] transition-all duration-300" placeholder="What did you learn? What will you do differently?"></textarea>
</section>
</main>
<!-- Footer Section -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-xl pt-6 pb-8 px-6 flex flex-col items-center gap-4">
<button class="w-full max-w-2xl bg-gradient-to-r from-primary-container to-primary text-on-primary-container font-bold text-[1rem] py-4 rounded-xl shadow-lg shadow-primary/10 hover:brightness-110 active:scale-[0.98] transition-all duration-300">
            Save Debrief
        </button>
<button class="text-on-surface-variant font-medium text-[0.875rem] hover:text-primary transition-colors">
            Skip for now
        </button>
</footer>
<!-- Subtle Background Elements -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none -z-10 overflow-hidden">
<div class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] bg-secondary-container opacity-5 blur-[120px] rounded-full"></div>
<div class="absolute top-[40%] -left-[5%] w-[30%] h-[30%] bg-primary opacity-5 blur-[100px] rounded-full"></div>
</div>
</body></html>
