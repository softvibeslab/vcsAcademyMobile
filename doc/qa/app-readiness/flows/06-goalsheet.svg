<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="930" viewBox="0 0 1080 930">
<defs><linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#d4af37"/><stop offset="1" stop-color="#f2ca50"/></linearGradient><radialGradient id="halo" cx="50%" cy="15%" r="80%"><stop offset="0" stop-color="#264191" stop-opacity="0.28"/><stop offset="1" stop-color="#131317" stop-opacity="1"/></radialGradient></defs><rect width="100%" height="100%" fill="url(#halo)"/><text x="540" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#eae1d4">Smart GoalSheet</text><text x="540" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d0c5af">Daily field log and performance insight</text><rect x="190" y="150" width="700" height="86" rx="14" fill="#1b1b20" stroke="#f2ca50" stroke-opacity="0.85"/><circle cx="238" cy="193" r="23" fill="url(#gold)" stroke="#f2ca50"/><text x="238" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#110e07">1</text><text x="278" y="185" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#eae1d4">Select tour result</text><text x="278" y="212" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d0c5af">Qualified, Close Today, Not Qualified, No Tour</text><path d="M 540 242 L 540 262" stroke="#f2ca50" stroke-width="3" stroke-linecap="round" opacity="0.65"/><path d="M 532 252 L 540 262 L 548 252" fill="none" stroke="#f2ca50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/><rect x="190" y="270" width="700" height="86" rx="14" fill="#1b1b20" stroke="#4d4635" stroke-opacity="0.45"/><circle cx="238" cy="313" r="23" fill="#231f17" stroke="#f2ca50"/><text x="238" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#f2ca50">2</text><text x="278" y="305" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#eae1d4">Record sales result</text><text x="278" y="332" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d0c5af">Sold/no sale, volume, count, reason</text><path d="M 540 362 L 540 382" stroke="#f2ca50" stroke-width="3" stroke-linecap="round" opacity="0.65"/><path d="M 532 372 L 540 382 L 548 372" fill="none" stroke="#f2ca50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/><rect x="190" y="390" width="700" height="86" rx="14" fill="#1b1b20" stroke="#4d4635" stroke-opacity="0.45"/><circle cx="238" cy="433" r="23" fill="#231f17" stroke="#f2ca50"/><text x="238" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#f2ca50">3</text><text x="278" y="425" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#eae1d4">Add follow ups</text><text x="278" y="452" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d0c5af">Dates and notes become reminders</text><path d="M 540 482 L 540 502" stroke="#f2ca50" stroke-width="3" stroke-linecap="round" opacity="0.65"/><path d="M 532 492 L 540 502 L 548 492" fill="none" stroke="#f2ca50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/><rect x="190" y="510" width="700" height="86" rx="14" fill="#1b1b20" stroke="#f2ca50" stroke-opacity="0.85"/><circle cx="238" cy="553" r="23" fill="url(#gold)" stroke="#f2ca50"/><text x="238" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#110e07">4</text><text x="278" y="545" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#eae1d4">Save entry</text><text x="278" y="572" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d0c5af">Backend calculates insight and metrics</text><rect x="90" y="660" width="900" height="72" rx="12" fill="#110e07" stroke="#4d4635" stroke-opacity="0.5"/><text x="120" y="689" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#f2ca50">API / DATA</text><text x="120" y="714" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#eae1d4">GET/POST /api/goalsheet, GET /api/goalsheet/metrics</text><rect x="90" y="756" width="900" height="92" rx="12" fill="#1f1b13" stroke="#f2ca50" stroke-opacity="0.28"/><text x="120" y="785" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#f2ca50">GUARDRAILS</text><text x="120" y="814" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d0c5af">- No negative sales values</text><text x="120" y="838" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d0c5af">- Sales count &gt; 0 requires sold outcome</text></svg>
